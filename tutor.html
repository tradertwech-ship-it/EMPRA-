<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1f3d">
<title>AI voice tutor – Uganda Smart Learning</title>
<meta name="description" content="Learning notes, past-paper practice, timed exams and a voice tutor for Ugandan secondary students, S1 to S6.">
<style>
/* Uganda Smart Learning — shared styles. System fonts only (low bandwidth). */
:root{
  --navy:#0b1f4d; --navy-2:#243a6b; --orange:#2563eb; --orange-d:#1d4ed8; --orange-soft:#eaf1ff; /* 'orange' names kept for code compatibility; the accent is now blue */
  --bg:#ffffff; --soft:#f5f7fb; --line:#e3e8f0; --muted:#5a6784; --ok:#16794a; --ok-soft:#e6f6ee;
  --bad:#b42318; --bad-soft:#fdecea; --warn:#8a5a00; --warn-soft:#fff6dd; --info:#1f4fa3; --info-soft:#e8f0fd;
  --r:20px; --shadow:0 1px 2px rgba(15,31,61,.06),0 6px 18px rgba(15,31,61,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--navy);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .5em;color:var(--navy)}
h1{font-size:clamp(1.6rem,4.5vw,2.4rem)} h2{font-size:clamp(1.25rem,3vw,1.6rem)} h3{font-size:1.1rem}
p{margin:0 0 .9em} a{color:var(--orange-d)} img{max-width:100%}
.muted{color:var(--muted)} .small{font-size:.875rem} .center{text-align:center} .right{text-align:right}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:0;background:var(--navy);color:#fff;padding:.6rem 1rem;z-index:100}
.skip:focus{left:8px;top:8px}
.container{width:100%;max-width:1100px;margin:0 auto;padding:0 16px}
main.container{padding-top:20px;padding-bottom:96px;min-height:70vh}

/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line)}
.topbar .container{display:flex;align-items:center;gap:14px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--navy);text-decoration:none;white-space:nowrap}
.logo{width:34px;height:34px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:1rem;position:relative}
.logo::after{content:"";position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;background:var(--orange);border:2px solid #fff}
.nav{display:flex;gap:4px;margin-left:12px;flex:1}
.nav a{padding:8px 12px;border-radius:10px;color:var(--navy-2);text-decoration:none;font-weight:600;font-size:.95rem}
.nav a:hover{background:var(--soft)} .nav a[aria-current=page]{background:var(--orange-soft);color:var(--orange-d)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-weight:700;font-size:.85rem;text-decoration:none;border:1px solid var(--line);background:var(--soft);color:var(--navy)}
.pill.trial{background:var(--warn-soft);border-color:#f3dfa0;color:var(--warn)}
.pill.paid{background:var(--ok-soft);border-color:#b8e3cc;color:var(--ok)}
.pill.expired,.pill.ready{background:var(--orange-soft);border-color:#bcd2ff;color:var(--orange-d)}
.bottomnav{display:none}
@media (max-width:820px){
  .nav{display:none}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
  .bottomnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;min-height:56px;font-size:.72rem;font-weight:700;color:var(--muted);text-decoration:none}
  .bottomnav a span{font-size:1.25rem;line-height:1}
  .bottomnav a[aria-current=page]{color:var(--orange-d)}
  .brand small{display:none}
}

/* cards, grid */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none} .card.soft{background:var(--soft);box-shadow:none}
.card.accent{border-color:#bcd2ff;background:linear-gradient(135deg,#eaf1ff,#f6f9ff);box-shadow:none}
.grid{display:grid;gap:14px} .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.auto{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
@media (max-width:820px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}.g-keep2{grid-template-columns:repeat(2,1fr)!important}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between}
.stack>*+*{margin-top:14px} .mt{margin-top:16px} .mt2{margin-top:28px} .mb0{margin-bottom:0}
.stat{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff}
.stat b{display:block;font-size:1.6rem;line-height:1.1} .stat span{color:var(--muted);font-size:.85rem}

/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:12px;border:1px solid var(--navy);background:var(--navy);color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--navy-2)} .btn.orange{background:linear-gradient(135deg,#1d4ed8,#3b82f6);border-color:#1d4ed8} .btn.orange:hover{background:linear-gradient(135deg,#1e40af,#2563eb)}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--line)} .btn.ghost:hover{background:var(--soft)}
.btn.danger{background:var(--bad);border-color:var(--bad)} .btn.sm{min-height:36px;padding:6px 12px;font-size:.875rem;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed} .btn.block{width:100%}
label{display:block;font-weight:700;font-size:.9rem;margin:0 0 6px}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid #c9d2e0;border-radius:12px;background:#fff;color:var(--navy);font:inherit}
textarea{min-height:110px;resize:vertical} input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--orange)}
.field{margin-bottom:14px} .check{display:flex;gap:10px;align-items:flex-start;font-weight:500} .check input{margin-top:5px}
.hint{font-size:.82rem;color:var(--muted);margin-top:4px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.tab{white-space:nowrap;min-height:40px;padding:8px 14px;border:1px solid var(--line);background:#fff;border-radius:999px;font:inherit;font-weight:700;color:var(--navy-2);cursor:pointer}
.tab[aria-selected=true]{background:var(--navy);color:#fff;border-color:var(--navy)}

/* badges, alerts */
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.75rem;font-weight:800;letter-spacing:.01em;background:var(--soft);color:var(--navy-2);border:1px solid var(--line);vertical-align:middle}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:#b8e3cc} .badge.warn{background:var(--warn-soft);color:var(--warn);border-color:#f3dfa0}
.badge.bad{background:var(--bad-soft);color:var(--bad);border-color:#f5c2bd} .badge.info{background:var(--info-soft);color:var(--info);border-color:#c6d8f7}
.badge.orange{background:var(--orange-soft);color:var(--orange-d);border-color:#bcd2ff}
.alert{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--soft);font-size:.92rem}
.alert.warn{background:var(--warn-soft);border-color:#f3dfa0;color:#5f3d00} .alert.bad{background:var(--bad-soft);border-color:#f5c2bd;color:#7a1a12}
.alert.ok{background:var(--ok-soft);border-color:#b8e3cc;color:#0e5232} .alert.info{background:var(--info-soft);border-color:#c6d8f7;color:#173a78}
.progress{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,#1d4ed8,#38bdf8);border-radius:999px;transition:width .3s}
.progress.ok>i{background:var(--ok)} .progress.bad>i{background:var(--bad)}

/* hero (welcome) */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:start;padding:24px 0}
.hero h1 span{color:var(--orange)} .hero .lead{font-size:1.1rem;color:var(--muted);max-width:34em}
.feature{display:flex;gap:12px} .feature .ico{flex:none;width:44px;height:44px;border-radius:12px;background:var(--orange-soft);display:grid;place-items:center;font-size:1.3rem}
.feature h3{margin:0 0 2px;font-size:1rem} .feature p{margin:0;color:var(--muted);font-size:.9rem}
@media (max-width:820px){.hero{grid-template-columns:1fr}}

/* lists & tables */
.list{list-style:none;margin:0;padding:0} .list li{padding:12px 0;border-bottom:1px solid var(--line)} .list li:last-child{border:0}
.item{display:flex;align-items:center;gap:12px;justify-content:space-between}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.9rem} th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)} tr:last-child td{border:0}
.subject-card{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;cursor:pointer;text-align:left;font:inherit;width:100%}
.subject-card:hover,.subject-card[aria-pressed=true]{border-color:var(--orange);background:var(--orange-soft)}
.crumbs{font-size:.85rem;color:var(--muted);margin-bottom:8px}
.notes h3{margin-top:1.2em} .notes ul{padding-left:1.2em} .notes .box{background:var(--soft);border-left:4px solid var(--orange);padding:10px 14px;border-radius:8px;margin:12px 0}

/* modal & toast */
.overlay{position:fixed;inset:0;background:rgba(15,31,61,.55);display:grid;place-items:center;z-index:80;padding:16px}
.modal{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:820px}
#toasts{position:fixed;left:0;right:0;bottom:76px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;max-width:520px;font-size:.92rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad)} .toast.ok{background:var(--ok)}

/* tutor chat */
.chat{display:flex;flex-direction:column;gap:10px;min-height:320px;max-height:56vh;overflow-y:auto;padding:12px;background:var(--soft);border-radius:14px;border:1px solid var(--line)}
.bubble{max-width:88%;padding:10px 14px;border-radius:16px;font-size:.96rem;white-space:pre-wrap}
.bubble.me{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.bubble.bot{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.bubble .src{display:block;margin-top:8px;font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:38px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:700;font-size:.88rem;color:var(--navy-2);cursor:pointer}
.chip:hover{border-color:var(--orange);background:var(--orange-soft)}
.mic{width:48px;height:48px;border-radius:50%;border:0;background:var(--orange);color:#fff;font-size:1.3rem;cursor:pointer;flex:none}
.mic.on{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(180,35,24,.15)}}
.speechbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.speechbar select{width:auto;min-height:36px;padding:4px 8px}

/* quiz / exam */
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:#fff;font-weight:500}
.opt:hover{border-color:var(--orange)} .opt.sel{border-color:var(--orange);background:var(--orange-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt input{margin-top:5px}
.examtop{position:sticky;top:60px;z-index:30;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.2rem} .timer.low{color:var(--bad)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.qn{min-height:42px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:700;cursor:pointer}
.qn.done{background:var(--orange-soft);border-color:#bcd2ff} .qn.cur{background:var(--navy);color:#fff;border-color:var(--navy)} .qn.flag{outline:2px solid var(--warn)}
.exam-layout{display:grid;grid-template-columns:1fr 260px;gap:14px;align-items:start}
@media (max-width:820px){.exam-layout{grid-template-columns:1fr}.examtop{top:60px}}
.model{background:var(--info-soft);border:1px solid #c6d8f7;border-radius:12px;padding:12px;margin-top:8px}
.bar{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
@media (max-width:560px){.bar{grid-template-columns:100px 1fr 48px}}
.demo-box{border:2px dashed #b9a06a;background:#fffbe9;border-radius:14px;padding:14px}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.topbar,.bottomnav,.btn{display:none!important}}

/* ===== landing page (blue take on the reference design) ===== */
body.land{background:#e6eeff}
.land main{padding:14px 14px 40px}
.sheet{max-width:1180px;margin:0 auto;background:#f8faff;border-radius:30px;box-shadow:0 10px 40px rgba(29,78,216,.15);overflow:hidden;border:1px solid #d5e2ff}
.l-nav{display:flex;align-items:center;gap:16px;padding:16px 28px}
.l-nav .links{display:flex;gap:22px;margin-left:24px;flex:1}
.l-nav .links a{color:var(--navy-2);text-decoration:none;font-weight:600;font-size:.95rem}
.l-nav .links a:hover{color:var(--orange-d)}
.l-nav .btns{display:flex;gap:10px;margin-left:auto}
.btn.pillbtn{border-radius:999px}
.l-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;padding:34px 28px 44px;align-items:center}
.l-hero h1{font-size:clamp(2rem,5vw,3.3rem);letter-spacing:-.02em;margin-bottom:14px}
.l-hero h1 span{background:linear-gradient(90deg,#1d4ed8,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}
.l-hero .lead{color:var(--muted);font-size:1.08rem;max-width:32em}
.l-art{position:relative;min-height:340px;display:grid;place-items:center}
.l-art .blob{width:min(320px,80%);aspect-ratio:1;border-radius:46% 54% 48% 52%/52% 46% 54% 48%;background:linear-gradient(145deg,#1d4ed8,#60a5fa 70%,#a5d8ff);display:grid;place-items:center;font-size:7rem;box-shadow:0 20px 50px rgba(29,78,216,.35)}
.l-art .fl{position:absolute;background:#fff;border-radius:16px;padding:10px 14px;box-shadow:0 8px 24px rgba(29,78,216,.2);font-weight:700;font-size:.85rem;display:flex;gap:8px;align-items:center}
.fl.a{left:2%;top:14%}.fl.b{right:0;top:34%}.fl.c{left:8%;bottom:8%}
.band{background:linear-gradient(135deg,#1d4ed8,#2f6df0 60%,#4f8cf7);color:#fff;padding:18px 28px;display:flex;gap:10px 30px;flex-wrap:wrap;justify-content:center;align-items:center;font-weight:800;font-size:1.05rem}
.band span{opacity:.95}
.l-sec{padding:44px 28px}
.l-sec h2{font-size:clamp(1.5rem,3.5vw,2.1rem);text-align:center}
.l-sec .sub{text-align:center;color:var(--muted);max-width:40em;margin:0 auto 24px}
.searchbar{display:flex;gap:10px;max-width:560px;margin:0 auto 22px;background:#fff;border:1px solid #cfdcff;border-radius:999px;padding:6px 6px 6px 18px;box-shadow:var(--shadow)}
.searchbar input{border:0;min-height:40px;padding:0;background:transparent;box-shadow:none}
.searchbar input:focus{outline:none}
.benefit{display:grid;grid-template-columns:.9fr 1.1fr;gap:30px;align-items:center;background:#fff;border:1px solid #d5e2ff;border-radius:28px;padding:28px}
.artgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;border:2px dashed #93b4ff;border-radius:30px}
.artgrid div{aspect-ratio:1;border-radius:24px;display:grid;place-items:center;font-size:3rem;background:linear-gradient(145deg,#dbe7ff,#bcd2ff)}
.artgrid div:nth-child(2),.artgrid div:nth-child(3){background:linear-gradient(145deg,#1d4ed8,#60a5fa);color:#fff}
.benefit .feature+.feature{margin-top:14px}
.ccard{background:#fff;border:1px solid #d5e2ff;border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.ccard .thumb{height:110px;border-radius:16px;background:linear-gradient(135deg,#1d4ed8,#60a5fa);color:#fff;display:grid;place-items:center;font-size:2.2rem;font-weight:800;margin-bottom:12px}
.steps{counter-reset:s}
.step{background:#fff;border:1px solid #d5e2ff;border-radius:22px;padding:18px 18px 18px 64px;position:relative}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:16px;top:16px;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;display:grid;place-items:center;font-weight:800}
.step h3{margin:0 0 4px;font-size:1rem}.step p{margin:0;color:var(--muted);font-size:.9rem}
.cta{margin:0 28px 44px;border-radius:28px;background:linear-gradient(135deg,#1d4ed8,#2f6df0 60%,#4f8cf7);color:#fff;padding:32px;display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:center}
.cta h2,.cta h3{color:#fff;text-align:left}.cta p{opacity:.95}
.cta .btn.ghost{background:#fff;color:var(--orange-d);border-color:#fff}
.cta ul{margin:0;padding-left:1.1em}
.price{background:#fff;border:1px solid #bcd2ff;border-radius:26px;padding:26px;text-align:center;box-shadow:0 10px 30px rgba(29,78,216,.15)}
.price b.big{font-size:2.6rem;display:block;color:var(--orange-d);line-height:1.1}
.price ul{text-align:left;display:inline-block;margin:12px 0}
#join{scroll-margin-top:16px;background:#eaf1ff}
.l-foot{padding:22px 28px;text-align:center;color:var(--muted);font-size:.85rem;border-top:1px solid #d5e2ff}
@media (max-width:860px){.l-nav .links{display:none}.l-nav{padding:14px 16px}.l-hero,.benefit,.cta{grid-template-columns:1fr}.l-hero{padding:20px 16px 30px}.l-sec{padding:34px 16px}.cta{margin:0 14px 30px;padding:24px}.l-art{min-height:280px}.l-art .blob{font-size:5rem}}

</style>
</head>

<main id="main" class="container" tabindex="-1"><p class="muted">Loading…</p></main>

<script>

  /* ---------- crypto ---------- */
  async function hash(pw, salt) {
    try {

  }

    if (root.crypto && root.crypto.subtle) return hex(await root.crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)));

  }

  /* ---------- helpers ---------- */

  function textToHtml(t) {
    const out = []; let list = false;

  function parseQuestions(text, needKeys) {

      if (signature !== expect) { audit('payment.bad_signature', null, String(payload.ref)); save(); return err('Invalid signature — callback rejected.'); }

      if (Number(payload.amount) !== p.amount) { audit('payment.amount_mismatch', p.userId, p.ref); save(); return err('Amount does not match the expected price.'); }
      if (payload.status === 'success') {
        if (p.status === 'success') { audit('payment.duplicate_ignored', p.userId, p.ref); save(); return okr({ duplicate: true, message: 'Duplicate confirmation ignored — no extra days added.' }); }
        if (p.status === 'reversed') { audit('payment.late_success_ignored', p.userId, p.ref); save(); return err('This transaction was already reversed.'); }
        const latest = db.subs.filter(s => s.userId === p.userId && s.status === 'active').reduce((m, s) => Math.max(m, s.expires), 0);
        const start = Math.max(now(), latest);
        db.subs.push({ id: uid('sub'), userId: p.userId, paymentId: p.id, start, expires: start + p.days * DAY, status: 'active' });

      }
      if (payload.status === 'failed') { if (p.status === 'pending') { p.status = 'failed'; p.updatedAt = now(); audit('payment.failed', p.userId, p.ref); notify(p.userId, 'Your payment did not go through. No money was taken for the subscription.'); save(); } return okr({ message: 'Marked failed.' }); }

  /* ---------- grounded tutor (local retrieval). Swap `AI.provider` for an LLM behind your server. ---------- */
  const STOP = new Set('the a an of to in is are was what how why does do did can could would i me my you your please explain about tell give with and or for on it this that be as at by from show teach'.split(' '));
  const stem = w => w.length > 4 ? w.replace(/(ing|es|s)$/, '') : w;
  const tok = s => String(s).toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(w => w && w.length > 1 && !STOP.has(w)).map(stem);
  const plain = h => String(h || '').replace(/<br\s*\/?>/g, '. ').replace(/<\/(p|li|h3|div)>/g, '. ').replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/\s+/g, ' ').replace(/\.\s*\./g, '.').trim();
  const AI = {
    provider: 'local-retrieval',
    search(q, classId, subjectId) {
      load(); const qt = [...new Set(tok(q))]; if (!qt.length) return null;
      let best = null;
      db.lessons.filter(l => l.status === 'published' && l.cls === classId && (!subjectId || l.subject === subjectId)).forEach(l => {
        const head = tok(l.title + ' ' + l.topic + ' ' + l.subtopic), body = tok(plain(l.notes) + ' ' + (l.objectives || []).join(' ') + ' ' + l.example);
        let s = 0, m = 0; qt.forEach(w => { if (head.includes(w)) { s += 3; m++; } else if (body.includes(w)) { s += 1; m++; } });
        if (m >= Math.ceil(qt.length / 2) && (!best || s > best.s)) best = { l, s, qt };
      });
      return best;
    },
    answer(q, o) {
      const hit = AI.search(q, o.classId, o.subjectId);
      if (!hit) return { found: false, text: 'I could not find that in the approved notes for this class and subject, so I will not guess. Try different words, pick another subject, or ask your teacher. You can also browse the Library.' };
      const l = hit.l, notes = plain(l.notes), sents = notes.match(/[^.!?]+[.!?]+/g) || [notes];
      let text;
      if (o.mode === 'example') text = 'Worked example: ' + plain(l.example);
      else if (o.mode === 'simple') text = 'In simple terms: ' + sents.slice(0, 2).join(' ').trim() + (l.objectives && l.objectives.length ? ' The key things to remember: ' + l.objectives.join('; ') + '.' : '');
      else { const m = sents.filter(s => tok(s).some(w => hit.qt.includes(w))).slice(0, 3); text = (m.length ? m : sents.slice(0, 2)).join(' ').trim(); }
      return { found: true, text, lesson: l };
    },
    quizQuestion(classId, subjectId, weak) {
      load(); const pool = [];
      db.lessons.filter(l => l.status === 'published' && l.cls === classId && (!subjectId || l.subject === subjectId)).forEach(l => (l.quiz || []).forEach((q, i) => pool.push({ l, q, i, weak: weak.some(w => w.topic === l.topic && w.subject === l.subject) })));
      if (!pool.length) return null; const w = pool.filter(p => p.weak); const src = w.length ? w : pool; return src[Math.floor(Math.random() * src.length)];
    }
  };

  const Speech = {
    rate: parseFloat(LS && LS.getItem('usl_rate')) || 1, last: '',
    supported() { return isBrowser && 'speechSynthesis' in root; },
    speak(text) {
      if (!Speech.supported()) return false; Speech.stop(); Speech.last = text;
      const sents = String(text).replace(/\s+/g, ' ').match(/[^.!?;:]+[.!?;:]*/g) || [text], parts = []; let cur = '';
      sents.forEach(s => { if ((cur + s).length > 170) { if (cur) parts.push(cur); cur = s; } else cur += s; }); if (cur) parts.push(cur);
      parts.forEach(p => { const u = new SpeechSynthesisUtterance(p.trim()); u.rate = Speech.rate; u.lang = 'en-GB'; root.speechSynthesis.speak(u); }); return true;
    },
    pause() { Speech.supported() && root.speechSynthesis.pause(); }, resume() { Speech.supported() && root.speechSynthesis.resume(); },
    stop() { Speech.supported() && root.speechSynthesis.cancel(); }, replay() { if (Speech.last) Speech.speak(Speech.last); },
    setRate(r) { Speech.rate = r; LS.setItem('usl_rate', r); },
    listen(onResult, onEnd, onErr) {

      const r = new SR(); r.lang = 'en-GB'; r.interimResults = false; r.maxAlternatives = 1;
      r.onresult = e => onResult(e.results[0][0].transcript); r.onend = onEnd; r.onerror = e => onErr && onErr(e.error); r.start(); return r;
    },
    bar(el, getText) {
      if (!Speech.supported()) { el.innerHTML = '<p class="hint">Read-aloud is not supported by this browser. Try Chrome on Android or a recent desktop browser.</p>'; return; }
      el.innerHTML = '<div class="speechbar" role="group" aria-label="Read aloud controls"><button class="btn sm orange" data-a="play">🔊 Listen</button><button class="btn sm ghost" data-a="pause">⏸ Pause</button><button class="btn sm ghost" data-a="resume">▶ Resume</button><button class="btn sm ghost" data-a="replay">⟲ Replay</button><button class="btn sm ghost" data-a="stop">⏹ Stop</button><label class="small" style="margin:0">Speed <select data-a="rate" aria-label="Speaking speed">' + [0.75, 1, 1.25, 1.5].map(v => '<option value="' + v + '"' + (v === Speech.rate ? ' selected' : '') + '>' + v + '×</option>').join('') + '</select></label></div>';
      el.onclick = e => { const a = e.target.closest('button') && e.target.closest('button').dataset.a; if (a === 'play') Speech.speak(getText()); if (a === 'pause') Speech.pause(); if (a === 'resume') Speech.resume(); if (a === 'replay') Speech.replay(); if (a === 'stop') Speech.stop(); };
      el.querySelector('select').onchange = e => { Speech.setRate(parseFloat(e.target.value)); if (Speech.last && root.speechSynthesis.speaking) Speech.replay(); };
    }
  };

  /* ---------- UI helpers (browser only) ---------- */
  function toast(msg, type) {
    let box = $('#toasts'); if (!box) { box = document.createElement('div'); box.id = 'toasts'; box.setAttribute('aria-live', 'polite'); document.body.appendChild(box); }
    const t = document.createElement('div'); t.className = 'toast ' + (type || ''); t.textContent = msg; box.appendChild(t); setTimeout(() => t.remove(), type === 'bad' ? 7000 : 5000);
  }
  function modal(html, o) {
    o = o || {}; const ov = document.createElement('div'); ov.className = 'overlay';
    ov.innerHTML = '<div class="modal' + (o.wide ? ' wide' : '') + '" role="dialog" aria-modal="true">' + html + '</div>'; document.body.appendChild(ov);
    const close = () => { ov.remove(); document.removeEventListener('keydown', onk); };
    const onk = e => { if (e.key === 'Escape' && !o.locked) close(); }; document.addEventListener('keydown', onk);
    const f = ov.querySelector('button,input,select,textarea,a'); f && f.focus(); return { el: ov.firstChild, close };
  }
  function confirmBox(msg, o) {
    o = o || {}; return new Promise(res => {
      const m = modal('<h3>' + esc(o.title || 'Please confirm') + '</h3><p>' + msg + '</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-v="0">' + esc(o.cancel || 'Cancel') + '</button><button class="btn ' + (o.danger ? 'danger' : 'orange') + '" data-v="1">' + esc(o.ok || 'Confirm') + '</button></div>');
      m.el.onclick = e => { const b = e.target.closest('button'); if (b) { m.close(); res(b.dataset.v === '1'); } };
    });
  }
  function csv(rows) { return rows.map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\n'); }
  function download(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
  function pill(a) {
    const cfg = Server.cfg();
    if (a.state === 'paid') return ['paid', '✓ Subscribed · ' + fmtMs(a.msLeft) + ' left'];
    if (a.state === 'trial') return ['trial', '⏱ Free trial ' + fmtMs(a.msLeft)];
    if (a.state === 'trial_ready') return ['ready', 'Start free trial'];
    if (a.state === 'staff') return ['paid', 'Staff'];
    return ['expired', 'Subscribe · ' + fmtUGX(cfg.price)];
  }
  function shell(user, page, a) {
    const staff = user.role !== 'student';
    const items = [['dashboard', 'dashboard.html', 'Home', '🏠'], ['library', 'library.html', 'Library', '📚'], ['papers', 'papers.html', 'Exam centre', '📝'], ['tutor', 'tutor.html', 'AI tutor', '🎙️'], ['profile', 'profile.html', 'Account', '👤']];
    if (staff) items.push(['admin', 'admin.html', 'Admin', '🛠️']);
    const cur = k => k === page ? ' aria-current="page"' : ''; const [pc, pt] = pill(a);
    const head = document.createElement('div');
    head.innerHTML = '<a class="skip" href="#main">Skip to content</a><header class="topbar"><div class="container"><a class="brand" href="dashboard.html"><span class="logo" aria-hidden="true">🎓</span><span>Uganda Smart Learning</span></a><nav class="nav" aria-label="Main">' + items.map(i => '<a href="' + i[1] + '"' + cur(i[0]) + '>' + i[2] + '</a>').join('') + '</nav><div class="top-right"><a id="pill" class="pill ' + pc + '" href="subscription.html">' + esc(pt) + '</a></div></div></header>';
    document.body.prepend(head);
    const bn = document.createElement('nav'); bn.className = 'bottomnav'; bn.setAttribute('aria-label', 'Main'); bn.style.gridTemplateColumns = 'repeat(' + items.length + ',1fr)';
    bn.innerHTML = items.map(i => '<a href="' + i[1] + '"' + cur(i[0]) + '><span aria-hidden="true">' + i[3] + '</span>' + i[2].replace('Exam centre', 'Exams') + '</a>').join(''); document.body.appendChild(bn);
  }
  function lockedOverlay(reason) {
    if ($('#locked')) return; root.dispatchEvent(new Event('usl:locked'));
    const m = modal('<h3>' + esc(reason === 'trial' ? 'Your free trial has ended' : 'Your access has ended') + '</h3><p>Your progress is saved. Subscribe for ' + fmtUGX(Server.cfg().price) + ' per month to keep learning.</p><a class="btn orange block" href="subscription.html">See plans &amp; pay</a>', { locked: true }); m.el.id = 'locked';
  }
  async function boot(o) {
    o = o || {}; await ready; load();
    const cu = Server.currentUser();
    if (o.auth !== false && !cu.user) { location.replace('index.html' + (cu.reason ? '?msg=' + encodeURIComponent(cu.reason) : '')); return new Promise(() => { }); }
    if (!cu.user) return { user: null };
    const user = cu.user; let a = Server.access(user);
    if (o.staff && !can(user, o.staff)) { location.replace('dashboard.html'); return new Promise(() => { }); }
    if (o.paid && !allowed(a)) { location.replace('subscription.html?need=1&from=' + encodeURIComponent(o.page || '')); return new Promise(() => { }); }
    shell(user, o.page, a);
    setInterval(() => {
      const cur = Server.currentUser(); if (!cur.user) { location.replace('index.html?msg=' + encodeURIComponent(cur.reason || 'Please log in again.')); return; }
      a = Server.access(cur.user); const p = $('#pill'); if (p) { const [c, t] = pill(a); p.className = 'pill ' + c; p.textContent = t; }
      root.dispatchEvent(new CustomEvent('usl:tick', { detail: a }));
      if (o.paid && !allowed(a)) lockedOverlay(a.hadSub ? 'sub' : 'trial');
    }, 1000);
    return { user, access: a };
  }

  const waLink = (to, text) => 'https://wa.me/' + String(to || '').replace(/\D/g, '') + '?text=' + encodeURIComponent(text || '');
  const USL = { LS, waLink, ready, Server, Gateway, AI, Speech, boot, toast, modal, confirmBox, esc, $, $$, fmtUGX, fmtDate, fmtMs, csv, download, textToHtml, parseQuestions, parseQuiz, plain, allowed, can, normContact, deviceId, newDevice: () => { LS.setItem(DEV, uid('dev')); }, CATEGORIES, PERMS, today };
  root.USL = USL; if (typeof module !== 'undefined' && module.exports) module.exports = USL;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(async function () {
  const { Server, AI, Speech, esc, toast } = USL;
  const ctx = await USL.boot({ page: 'tutor', paid: true }); const u = ctx.user, main = document.getElementById('main');
  const db = Server.data(), qs = new URLSearchParams(location.search);
  let cls = qs.get('cls') || u.classId || 'S4', subj = qs.get('subject') || '';
  if (!db.classes.find(c => c.id === cls)) cls = db.classes[0].id;
  let lastLesson = null, lastBot = '', quiz = null, rec = null;
  const subName = id => (db.subjects.find(s => s.id === id) || {}).name || id;

  main.innerHTML = `<h1>AI voice tutor</h1>
    <p class="muted">Answers come from the approved notes for the class and subject you choose. If the notes don't cover your question, the tutor says so instead of guessing.</p>
    <div class="grid g3" style="margin-bottom:12px">
      <div><label for="cls">Class</label><select id="cls">${db.classes.map(c => '<option value="' + c.id + '"' + (c.id === cls ? ' selected' : '') + '>' + esc(c.id + ' – ' + c.name) + '</option>').join('')}</select></div>
      <div><label for="sub">Subject</label><select id="sub"></select></div>
      <div><label class="check" style="margin-top:28px"><input type="checkbox" id="spk"><span>Speak the answers</span></label></div>
    </div>
    <div id="chat" class="chat" role="log" aria-live="polite" aria-label="Conversation"></div>
    <div class="chips mt" aria-label="Quick actions"><button class="chip" data-a="simple">💡 Explain simply</button><button class="chip" data-a="example">🧮 Give an example</button><button class="chip" data-a="quiz">🎯 Quiz me (oral)</button><button class="chip" data-a="weak">🔁 Revise my weak topics</button></div>
    <form id="form" class="row mt" style="flex-wrap:nowrap"><button type="button" class="mic" id="mic" aria-label="Ask by voice" title="Ask by voice">🎤</button><input id="txt" placeholder="Type or speak your question…" aria-label="Your question" autocomplete="off"><button class="btn orange" type="submit">Send</button></form>
    <div class="card soft mt"><div id="speech"></div><p class="hint mb0" id="left"></p></div>
    <p class="hint">The tutor can make mistakes. Check important facts in your notes and with your teacher. Answers shown are taken from in-app lessons${'' /* production: LLM behind your server */}.</p>`;

  const chat = document.getElementById('chat'), txt = document.getElementById('txt'), spk = document.getElementById('spk');
  spk.checked = Speech.supported() && USL.LS.getItem('usl_spk') !== '0'; spk.disabled = !Speech.supported();
  spk.onchange = () => USL.LS.setItem('usl_spk', spk.checked ? '1' : '0');
  Speech.bar(document.getElementById('speech'), () => lastBot);
  const left = () => { document.getElementById('left').textContent = 'Tutor questions left today: ' + Server.aiLeft() + ' (limits keep the service affordable for everyone).'; }; left();

  function fillSubjects() {
    const subs = db.subjects.filter(s => s.classes.includes(cls)); if (subj && !subs.find(s => s.id === subj)) subj = '';
    document.getElementById('sub').innerHTML = '<option value="">All subjects</option>' + subs.map(s => '<option value="' + s.id + '"' + (s.id === subj ? ' selected' : '') + '>' + esc(s.name) + '</option>').join('');
  }
  fillSubjects();
  document.getElementById('cls').onchange = e => { cls = e.target.value; subj = ''; lastLesson = null; quiz = null; fillSubjects(); };
  document.getElementById('sub').onchange = e => { subj = e.target.value; lastLesson = null; quiz = null; };

  function say(who, html, plainText) {
    const b = document.createElement('div'); b.className = 'bubble ' + who; b.innerHTML = html; chat.appendChild(b); chat.scrollTop = chat.scrollHeight;
    if (who === 'bot' && plainText) { lastBot = plainText; if (spk.checked) Speech.speak(plainText); }
  }
  const src = l => '<span class="src">Source: <a href="lesson.html?id=' + encodeURIComponent(l.id) + '">' + esc(l.title) + '</a> (' + esc(l.cls) + ' · ' + esc(subName(l.subject)) + ') — ' + (l.review === 'sample' ? 'sample notes, not official' : 'reviewed notes') + '.</span>';
  const bot = (text, l) => say('bot', esc(text) + (l ? src(l) : ''), text);
  const use = text => { const r = Server.aiUse(text.length); if (!r.ok) { say('bot', esc(r.error)); return false; } left(); return true; };

  const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
  function askQuiz(weakOnly) {
    const weak = weakOnly ? Server.weakTopics() : []; if (weakOnly && !weak.length) say('bot', 'You have no weak topics yet, so here is a mixed question instead.');
    const pick = AI.quizQuestion(cls, subj, weak); if (!pick) return say('bot', 'There are no quiz questions for this class and subject yet.');
    if (!use('quiz')) return; quiz = pick;
    const t = 'Question: ' + pick.q.q + ' ' + pick.q.o.map((o, i) => 'Option ' + letters[i] + ': ' + o + '.').join(' ');
    say('bot', '<b>Question</b> (' + esc(pick.l.topic) + ')<br>' + esc(pick.q.q) + '<br>' + pick.q.o.map((o, i) => '<br><b>' + letters[i] + '.</b> ' + esc(o)).join('') + '<br><br><i>Say or type the letter, or "stop" to end.</i>', t);
  }
  function judge(text) {
    const t = text.trim().toLowerCase(); if (/^(stop|exit|quit|end)/.test(t)) { quiz = null; return bot('OK, quiz ended. Ask me anything or press "Quiz me" again.'); }
    if (/^(next|another|again)/.test(t)) return askQuiz(false);
    const { q, l } = quiz; let k = q.o.findIndex(o => t === o.toLowerCase() || t.includes(o.toLowerCase()));
    if (k < 0) { const say1 = { be: 'b', bee: 'b', see: 'c', sea: 'c', dee: 'd', ay: 'a' }; const m = t.replace(/[.,!?]/g, '').match(/^(?:it is |its |i think |option |answer |letter |number )*([a-f]|be|bee|see|sea|dee|ay|[1-6])$/); if (m) { const x = say1[m[1]] || m[1]; k = /\d/.test(x) ? +x - 1 : x.charCodeAt(0) - 97; } }
    if (k < 0 || k >= q.o.length) return bot('I did not catch an option. Say or type A, B, C or D — or "stop".');
    if (!use('judge')) return; const ok = k === q.a;
    const why = USL.plain(l.notes).match(/[^.!?]+[.!?]+/g) || []; const reply = (ok ? 'Correct! ' : 'Not quite. The correct answer is ' + letters[q.a] + ': ' + q.o[q.a] + '. ') + 'From the notes: ' + why.slice(0, 2).join(' ').trim() + ' Say "next" for another question, or "stop".';
    quiz.answered = true; bot(reply, l);
  }
  async function ask(text, mode) {
    text = text.trim(); if (!text) return; say('me', esc(text)); txt.value = '';
    if (/\b(suicide|kill myself|self.?harm|hurt myself|abuse|rape)\b/i.test(text)) return bot('I am sorry you are going through something hard. Please talk to a trusted adult, a teacher or a counsellor today. In Uganda you can call the Sauti Child Helpline on 116. I can only help with schoolwork here.');
    if (quiz && !mode) return judge(text);
    if (!mode && /\bquiz\b|test me/i.test(text)) return askQuiz(false);
    if (!mode && lastLesson && text.split(/\s+/).length <= 5) { if (/example/i.test(text)) mode = 'example'; else if (/simpl|easier|again/i.test(text)) mode = 'simple'; }
    if (!use(text)) return;
    const follow = mode && lastLesson && (mode === 'example' || mode === 'simple');
    const res = follow ? AI.answer(lastLesson.title + ' ' + lastLesson.topic, { classId: cls, subjectId: lastLesson.subject, mode }) : AI.answer(text, { classId: cls, subjectId: subj, mode });
    if (res.found) { lastLesson = res.lesson; bot(res.text, res.lesson); } else bot(res.text);
  }
  document.getElementById('form').onsubmit = e => { e.preventDefault(); ask(txt.value); };
  document.querySelector('.chips').onclick = e => {
    const a = e.target.closest('button') && e.target.closest('button').dataset.a; if (!a) return;
    if (a === 'quiz') { say('me', 'Quiz me'); return askQuiz(false); } if (a === 'weak') { say('me', 'Revise my weak topics'); return askQuiz(true); }
    if (!lastLesson) return say('bot', 'Ask a question about a topic first, then I can explain it simply or give an example.');
    quiz = null; ask(a === 'simple' ? 'Explain simply' : 'Give an example', a);
  };
  const mic = document.getElementById('mic');
  if (!(window.SpeechRecognition || window.webkitSpeechRecognition)) { mic.disabled = true; mic.title = 'Voice input is not supported in this browser — use the text box.'; }
  mic.onclick = () => {
    if (rec) { rec.stop(); return; } Speech.stop(); mic.classList.add('on'); mic.setAttribute('aria-label', 'Stop listening');
    rec = Speech.listen(t => { txt.value = t; ask(t); }, () => { rec = null; mic.classList.remove('on'); mic.setAttribute('aria-label', 'Ask by voice'); }, er => toast(er === 'not-allowed' ? 'Microphone permission was denied. You can type instead.' : 'Voice input stopped (' + er + ').', 'bad'));
    if (!rec) mic.classList.remove('on');
  };

  bot('Hello ' + u.name.split(' ')[0] + '! Ask me about a topic in your notes, or press "Quiz me" and I will ask you questions aloud.');
  const q0 = qs.get('q'); if (q0) ask('Explain ' + q0);
  window.addEventListener('beforeunload', () => Speech.stop());
})();

</script>
