<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uganda Smart Learning</title>
  <style>
    :root {
      --green: #15803d;
      --green-dark: #166534;
      --green-light: #dcfce7;
      --green-soft: #f0fdf4;
      --ink: #0f172a;
      --muted: #475569;
      --bg: #f4fbf6;
      --card: #ffffff;
      --border: #d1fae5;
      --bad: #dc2626;
      --warn: #d97706;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.55 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    a { color: var(--green); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .sheet { max-width: 1120px; margin: 0 auto; padding: 0 18px 40px; }

    /* Navigation */
    .l-nav {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 16px 0; flex-wrap: wrap;
    }
    .brand {
      display: inline-flex; align-items: center; gap: 10px;
      font-weight: 800; font-size: 1.15rem; color: var(--green-dark);
      text-decoration: none !important;
    }
    .brand .logo {
      width: 38px; height: 38px; border-radius: 12px;
      background: var(--green); color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
    }
    .links { display: flex; gap: 20px; flex-wrap: wrap; }
    .links a { color: var(--ink); font-weight: 600; font-size: .95rem; }
    .btns { display: flex; gap: 8px; }

    /* Buttons & Badges */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 11px 18px; border-radius: 12px; border: 1px solid transparent;
      background: var(--green); color: #fff; font: inherit; font-weight: 700;
      cursor: pointer; text-decoration: none !important; transition: .15s;
    }
    .btn:hover { background: var(--green-dark); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn.orange { background: var(--green); color: #fff; }
    .btn.orange:hover { background: var(--green-dark); }
    .btn.ghost {
      background: #fff; color: var(--green-dark); border-color: #bbf7d0;
    }
    .btn.ghost:hover { background: var(--green-soft); }
    .btn.sm { padding: 7px 13px; font-size: .88rem; }
    .btn.pillbtn { border-radius: 999px; }
    .btn.block { width: 100%; }

    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 999px;
      font-size: .78rem; font-weight: 700; background: #e2e8f0; color: #334155;
    }
    .badge.orange, .badge.ok { background: var(--green-light); color: var(--green-dark); }
    .badge.info { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    .badge.warn { background: #fef3c7; color: #92400e; }
    .badge.bad { background: #fee2e2; color: #991b1b; }

    /* Hero */
    .l-hero {
      display: grid; grid-template-columns: 1.2fr .8fr; gap: 28px;
      align-items: center; padding: 28px 0 36px;
    }
    .l-hero h1 { font-size: clamp(2rem, 4vw, 3rem); line-height: 1.15; margin: 10px 0 14px; }
    .l-hero h1 span { color: var(--green); }
    .lead { font-size: 1.08rem; color: var(--muted); max-width: 54ch; }
    .l-art {
      position: relative; min-height: 260px; border-radius: 24px;
      background: linear-gradient(135deg, var(--green), #059669);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 18px 40px rgba(21, 128, 61, .2);
    }
    .l-art .blob { font-size: 4.5rem; }
    .l-art .fl {
      position: absolute; background: #fff; padding: 8px 14px;
      border-radius: 999px; font-weight: 700; font-size: .85rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, .12); color: var(--green-dark);
    }
    .l-art .fl.a { top: 20px; left: 18px; }
    .l-art .fl.b { bottom: 22px; left: 22px; }
    .l-art .fl.c { top: 50%; right: 16px; transform: translateY(-50%); }

    /* Subject Band */
    .band {
      display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
      padding: 14px; background: var(--green-dark); color: #fff;
      border-radius: var(--radius); margin-bottom: 24px;
    }
    .band span {
      padding: 5px 12px; border-radius: 999px;
      background: rgba(255, 255, 255, .14); font-size: .88rem; font-weight: 600;
    }

    /* Sections & Cards */
    .l-sec { padding: 32px 0; }
    .l-sec h2 { text-align: center; font-size: 1.75rem; margin: 0 0 6px; }
    .l-sec .sub { text-align: center; color: var(--muted); margin: 0 0 22px; }
    .grid { display: grid; gap: 16px; }
    .g2 { grid-template-columns: repeat(2, 1fr); }
    .card, .ccard, .step, .price {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, .04);
    }
    .ccard .thumb {
      height: 76px; border-radius: 12px; color: #fff; font-weight: 800;
      font-size: 1.35rem; display: flex; align-items: center; padding: 0 16px;
      margin-bottom: 12px;
    }
    .searchbar {
      display: flex; gap: 10px; max-width: 560px; margin: 0 auto 20px;
    }
    .searchbar input { flex: 1; }

    /* Benefits */
    .benefit { display: grid; grid-template-columns: .8fr 1.2fr; gap: 28px; align-items: center; }
    .artgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .artgrid div {
      background: var(--green-light); border-radius: 20px; height: 120px;
      display: flex; align-items: center; justify-content: center; font-size: 2.6rem;
    }
    .feature { display: flex; gap: 14px; margin-top: 16px; }
    .feature .ico {
      width: 44px; height: 44px; flex: none; border-radius: 12px;
      background: var(--green-light); display: flex; align-items: center;
      justify-content: center; font-size: 1.3rem;
    }
    .feature h3 { margin: 0 0 4px; font-size: 1.05rem; }
    .feature p { margin: 0; color: var(--muted); font-size: .94rem; }

    /* Pricing & Auth */
    .price .big { display: block; font-size: 2.1rem; color: var(--green-dark); margin: 8px 0 2px; }
    .price ul { padding-left: 20px; line-height: 1.8; }
    .tabs { display: flex; gap: 6px; background: var(--green-soft); padding: 5px; border-radius: 12px; margin-bottom: 16px; }
    .tab {
      flex: 1; padding: 9px; border: 0; border-radius: 9px; background: transparent;
      font: inherit; font-weight: 700; cursor: pointer; color: var(--muted);
    }
    .tab[aria-selected="true"] { background: var(--green); color: #fff; }
    .field { margin-bottom: 13px; }
    .field label { display: block; font-weight: 600; font-size: .92rem; margin-bottom: 4px; }
    input, select, textarea {
      width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1;
      border-radius: 10px; font: inherit; background: #fff;
    }
    input:focus, select:focus { outline: 2px solid var(--green); border-color: var(--green); }
    .check { display: flex; gap: 9px; align-items: flex-start; font-size: .88rem; cursor: pointer; }
    .check input { width: auto; margin-top: 3px; accent-color: var(--green); }
    .hint { font-size: .82rem; color: var(--muted); margin-top: 4px; }
    .alert { padding: 10px 13px; border-radius: 10px; font-size: .92rem; }
    .alert.bad { background: #fee2e2; color: #991b1b; }
    .alert.ok { background: var(--green-light); color: var(--green-dark); }
    .alert.warn { background: #fef3c7; color: #92400e; }

    /* Teacher CTA & Footer */
    .cta {
      background: linear-gradient(135deg, var(--green-dark), var(--green));
      color: #fff; border-radius: 22px; padding: 28px;
      display: grid; grid-template-columns: 1.3fr .7fr; gap: 20px; align-items: center;
    }
    .cta h2 { margin-top: 0; }
    .cta ul { margin: 0; padding-left: 20px; line-height: 1.8; }
    .l-foot { text-align: center; color: var(--muted); font-size: .86rem; margin-top: 34px; }

    /* Utilities & Toasts */
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .small { font-size: .88rem; }
    .muted { color: var(--muted); }
    .center { text-align: center; }
    .mb0 { margin-bottom: 0; }
    #toasts { position: fixed; bottom: 18px; right: 18px; display: grid; gap: 8px; z-index: 9999; }
    .toast {
      background: var(--green-dark); color: #fff; padding: 11px 16px;
      border-radius: 12px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.2);
    }
    .toast.bad { background: var(--bad); }

    @media (max-width: 820px) {
      .l-hero, .benefit, .g2, .cta { grid-template-columns: 1fr; }
      .links { display: none; }
    }
  </style>
</head>

  <script>

    'use strict';
    const KEY = 'usl_db_v1', TOK = 'usl_token', DEV = 'usl_device', PASS = 'usl_pass', DAY = 864e5;
    const SERVER = !!root.USL_SERVER, DEV_EMAIL = String(root.USL_DEV_EMAIL || 'tradertwech@gmail.com').trim().toLowerCase(), HOOKS = () => root.USL_HOOKS || {};
    const LS = (function () {
      try { const t = '__usl_t'; root.localStorage.setItem(t, '1'); root.localStorage.removeItem(t); return root.localStorage; } catch (e) { }
      const m = {}; root.USL_STORAGE_BLOCKED = true;
      return { getItem: k => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, removeItem: k => { delete m[k]; } };
    })();
    const isBrowser = typeof document !== 'undefined';
    const DEFAULT_CFG = { price: 20000, currency: 'UGX', days: 30, trialMinutes: 15, aiDailyLimit: 30, aiCostPerCall: 30, payNumber: '0773014995', whatsappNumber: '0773014995', whatsappNotify: true };
    const CLASS_COLORS = { S1: '#16a34a', S2: '#15803d', S3: '#0d9488', S4: '#047857', S5: '#059669', S6: '#166534' };
    const CATEGORIES = ['Official UNEB past paper', 'NCDC sample assessment', 'School mock', 'Teacher-created assessment', 'Licensed publisher material', 'AI-generated practice'];
    const PERMS = ['Own content (author holds the rights)', 'Licensed / written permission held', 'Authorised by UNEB / NCDC', 'Permission pending'];
    const ROLE_PERMS = { admin: ['*'], reviewer: ['review', 'submit', 'moderate'], teacher: ['submit', 'moderate', 'teach'], contributor: ['submit', 'moderate'], student: [] };

    const $ = (s, r) => (r || document).querySelector(s);
    const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const today = () => new Date().toISOString().slice(0, 10);

    async function hash(pw, salt) {

        if (root.crypto && root.crypto.subtle) {
          const k = await root.crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);

    let db = null;

    function normContact(c) {
      c = (c || '').trim().toLowerCase();
      if (/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(c)) return c;
      const d = c.replace(/[\s\-()]/g, ''); const m = d.match(/^(?:\+?256|0)(7\d{8})$/);

    const deviceId = () => { let d = LS.getItem(DEV); if (!d) { d = uid('dev'); LS.setItem(DEV, d); } return d; };

    /* Local OTP fallback if no external SMS/Email hook is attached */
    async function issueOtp(contact, purpose) {
      load(); const k = contact + '|' + purpose, prev = db.otps[k], t = now();
      if (prev && prev.sentAt && t - prev.sentAt < 15000) return { error: 'Please wait ' + Math.ceil((15000 - (t - prev.sentAt)) / 1000) + ' seconds before asking for another code.' };

      const d = h.deliverOtp ? await h.deliverOtp(contact, purpose, code) : { ok: true, via: 'local-demo', demoCode: code };
      if (!d.ok) return { error: d.error || 'We could not send the code. Please try again.' };
      load(); db.otps[k] = { h: await sha(db.secret + '|' + k + '|' + code), exp: t + 10 * 60000, tries: 0, sentAt: t }; save();
      return { sent: true, via: d.via, demoCode: d.demoCode };
    }
    async function checkOtp(contact, purpose, code) {
      const k = contact + '|' + purpose; load(); const o = db.otps[k];
      if (!o || o.exp < now()) return 'The code has expired. Request a new one.';
      if (o.tries >= 5) return 'Too many wrong codes. Request a new one.';
      if ((await sha(db.secret + '|' + k + '|' + String(code).trim())) !== o.h) { o.tries++; save(); return 'That code is not correct.'; }

    }
    function startSession(u) {
      if (u.role === 'student') Object.keys(db.sessions).forEach(t => { if (db.sessions[t].userId === u.id) delete db.sessions[t]; });
      const t = rnd(24); db.sessions[t] = { userId: u.id, deviceId: u.role === 'student' ? u.deviceId : deviceId(), at: now() };
      LS.setItem(TOK, t); audit('login.ok', u.id, 'device ' + String(u.deviceId || deviceId()).slice(-6)); save();
      return okr({ role: u.role });
    }
    function sessionUser() {
      load(); if (!db) return { reason: '' };
      const t = LS.getItem(TOK), s = t && db.sessions[t];
      if (!s) return { reason: t ? 'Your session ended. Please log in again.' : '' };
      const u = db.users.find(x => x.id === s.userId);
      if (!u || u.status !== 'active') return { reason: 'This account is not active.' };
      return { user: u, session: s };
    }
    function accessOf(u) {
      if (!u) return { state: 'none' };
      if (u.role !== 'student') return { state: 'staff', role: u.role };
      const t = now();
      const sub = db.subs.filter(s => s.userId === u.id && s.status === 'active' && s.expires > t).sort((a, b) => b.expires - a.expires)[0];
      if (sub) return { state: 'paid', expires: sub.expires, msLeft: sub.expires - t };
      if (u.trialStartedAt) { const left = u.trialEndsAt - t; return left > 0 ? { state: 'trial', msLeft: left } : { state: 'expired' }; }
      return { state: 'trial_ready' };
    }

    const Server = {
      async register(f) {
        const name = (f.name || '').trim(), contact = normContact(f.contact);
        if (name.length < 2) return err('Enter your full name.');
        if (!contact) return err('Enter a valid email address or Ugandan phone number (e.g. 0772 123456).');
        if (!pwOk(f.password)) return err('Password needs at least 8 characters with letters and numbers.');
        if (!f.consent) return err('Please confirm you are 18+, or that a parent/guardian consents.');
        const salt = uid('s'), pw = await hash(f.password, salt);
        load(); const isDev = contact === DEV_EMAIL;
        if (!isDev && !db.classes.find(c => c.id === f.classId)) return err('Choose your class.');
        const old = db.users.find(u => u.contact === contact);
        if (old && old.verified) return err('An account with this contact already exists. Please log in.');
        if (old) db.users = db.users.filter(u => u !== old);
        const u = { id: uid('u'), role: isDev ? 'admin' : 'student', name, contact, classId: isDev ? null : f.classId, subjects: [], schoolCode: (f.schoolCode || '').trim(), salt, pw, verified: false, status: 'active', createdAt: now(), consentAt: now(), deviceId: null, deviceSince: null, trialStartedAt: null, trialEndsAt: null, dailyGoal: 2, failed: 0, lockUntil: 0 };
        db.users.push(u); audit('user.registered', u.id, contact); save();
        const o = await issueOtp(contact, 'verify'); if (o.error) { load(); db.users = db.users.filter(x => x.id !== u.id); save(); return err(o.error); }
        return okr(Object.assign({ contact }, o));
      },
      async resendCode(contact, purpose) { contact = normContact(contact); load(); const u = db.users.find(x => x.contact === contact); if (!u) return err('Unknown account.'); const o = await issueOtp(contact, purpose === 'transfer' ? 'transfer' : 'verify'); return o.error ? err(o.error) : okr(o); },
      async verifyRegistration(contact, code) {
        contact = normContact(contact); load(); const u = db.users.find(x => x.contact === contact); if (!u) return err('Unknown account.');
        const e = await checkOtp(contact, 'verify', code); if (e) return err(e);
        load(); const u2 = db.users.find(x => x.id === u.id); if (!u2) return err('Unknown account.');
        u2.verified = true; u2.deviceId = deviceId(); u2.deviceSince = now(); audit('user.verified', u2.id); notify(u2.id, 'Welcome to Uganda Smart Learning!');
        return startSession(u2);
      },
      async login(contact, password) {
        const c = normContact(contact); if (!c) return err('Enter the email or phone number you registered with.');
        load(); let u = db.users.find(x => x.contact === c);
        const good = u ? (await hash(password || '', u.salt)) === u.pw : false;
        if (!u || !good) return err('Incorrect contact or password.');
        if (u.status !== 'active') return err('This account is suspended.');
        if (!u.verified) { const o = await issueOtp(c, 'verify'); return o.error ? err(o.error) : okr(Object.assign({ needsVerify: true, contact: c }, o)); }
        return startSession(u);
      },
      async requestReset(contact) { const c = normContact(contact); if (!c) return err('Enter your email or phone number.'); load(); const u = db.users.find(x => x.contact === c); if (u) await issueOtp(c, 'reset'); return okr({ contact: c }); },
      async resetPassword(contact, code, password) {
        const c = normContact(contact); if (!pwOk(password)) return err('Password needs at least 8 characters with letters and numbers.');
        const e = await checkOtp(c, 'reset', code); if (e) return err(e);
        const salt = uid('s'), pw = await hash(password, salt); load(); const u = db.users.find(x => x.contact === c); if (!u) return err('Unknown account.');
        u.salt = salt; u.pw = pw; save(); return okr();
      },
      currentUser() { const r = sessionUser(); return r.user ? { user: r.user } : { reason: r.reason }; },
      access(u) { load(); return accessOf(u); },
      cfg() { load(); return db.cfg; },
      data() { load(); return db; }
    };

    /* Smart Sync: tries Vercel /api/rpc first; seamlessly seeds locally if running standalone */
    const ready = (async () => {
      load();
      if (!db || db.v !== 1 || !(db.classes && db.classes.length)) {
        await seed();
        save();
      }
      try {
        const r = await fetch('api/rpc', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          cache: 'no-store',
          body: JSON.stringify({ m: 'sync', a: [], d: deviceId(), t: LS.getItem(TOK) || '', nv: false })
        });
        if (r.ok) {
          const res = await r.json();
          if (res && res.view && res.view.classes && res.view.classes.length) {
            db = Object.assign(EMPTY(), res.view);
            save();
          }
        }
      } catch (e) { /* Running locally without /api/rpc — local seeded catalogue is already active */ }
    })();

    function toast(msg, type) {
      let box = $('#toasts');
      if (!box) { box = document.createElement('div'); box.id = 'toasts'; box.setAttribute('aria-live', 'polite'); document.body.appendChild(box); }
      const t = document.createElement('div'); t.className = 'toast ' + (type || ''); t.textContent = msg; box.appendChild(t);
      setTimeout(() => t.remove(), type === 'bad' ? 7000 : 5000);
    }

    root.USL = { ready, Server, toast, esc, $, $$, fmtUGX, fmtDate, fmtMs, LS, build: root.USL_BUILD };
  })(window);

  /* ---- page: index (Green Theme Home) ---- */
  (async function () {

      </div>
    </section>

    <div class="band" aria-label="Subjects">${db.subjects.slice(0, 8).map(s => '<span>' + esc(s.name) + '</span>').join('')}</div>

    <section class="l-sec">

        <div class="step"><h3>3. Learn and practise</h3><p class="muted small">Lessons, quizzes, timed papers and the voice tutor.</p></div>
        <div class="step"><h3>4. Subscribe</h3><p class="muted small">Pay with MTN Mobile Money or Airtel Money to keep going.</p></div>
      </div>
    </section>

    <section class="l-sec" id="join" style="padding-bottom:44px">
      <h2>Join today</h2>

        <div class="price">

          <span class="muted">per ${cfg.days} days</span>

          ${msg ? '<div class="alert warn" role="alert" style="margin-bottom:12px">' + esc(msg) + '</div>' : ''}
          <div class="tabs" role="tablist" aria-label="Account">

    const panel = document.getElementById('panel');

    const results = document.getElementById('results');
    function search() {

      results.innerHTML = rows.map(l => '<div class="ccard"><span class="badge info">' + esc(l.cls) + '</span> <span class="badge">' + esc(subName(l.subject)) + '</span><h3 style="margin-top:8px">' + esc(l.title) + '</h3><p class="small muted">' + esc(l.topic) + '</p><button class="btn sm orange pillbtn" data-open>Open lesson</button></div>').join('') || '<p class="muted center" style="grid-column:1/-1">No lesson matches yet.</p>';
      results.querySelectorAll('[data-open]').forEach(b => b.onclick = () => {

        toast('Logged in!', 'ok');
        setTimeout(() => location.reload(), 500);
      };
    }

    signup();
  })();
  </script>
