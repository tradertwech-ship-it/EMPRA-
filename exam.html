<title>Exam simulator – Uganda Smart Learning</title>
<meta name="description" content="Learning notes, past-paper practice, timed exams and a voice tutor for Ugandan secondary students, S1 to S6.">

<body>
<main id="main" class="container" tabindex="-1"><p class="muted">Loading…</p></main>
<script>/* If the app files are missing, say so instead of showing "Loading…" forever. */
setTimeout(function(){var m=document.getElementById('main');if(typeof window.USL==='undefined'&&m&&/^\s*Loading/.test(m.textContent)){m.innerHTML='<div style="max-width:560px;margin:40px auto;font:16px/1.5 system-ui,sans-serif;color:#0b1f4d"><h2>The app files were not found</h2><p>Please unzip the whole download first, then open <b>index.html</b> from the unzipped <b>usl</b> folder (the <b>css</b> and <b>js</b> folders must sit next to it). Do not open pages from inside the zip or send a single page on its own.</p></div>';}},2500);
</script>
<noscript><p class="container">Please enable JavaScript to use Uganda Smart Learning.</p></noscript>
<script src="js/guard.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/p-exam.js"></script>
</body>
