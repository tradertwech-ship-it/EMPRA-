<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1f3d">
<title>Class discussion – Uganda Smart Learning</title>
<meta name="description" content="Learning notes, past-paper practice, timed exams and a voice tutor for Ugandan secondary students, S1 to S6.">
<style>
/* Uganda Smart Learning — shared styles. System fonts only (low bandwidth). */
:root{
  --navy:#0b1f4d; --navy-2:#243a6b; --orange:#2563eb; --orange-d:#1d4ed8; --orange-soft:#eaf1ff; /* 'orange' names kept for code compatibility; the accent is now blue */
  --bg:#ffffff; --soft:#f5f7fb; --line:#e3e8f0; --muted:#5a6784; --ok:#16794a; --ok-soft:#e6f6ee;
  --bad:#b42318; --bad-soft:#fdecea; --warn:#8a5a00; --warn-soft:#fff6dd; --info:#1f4fa3; --info-soft:#e8f0fd;
  --r:20px; --shadow:0 1px 2px rgba(15,31,61,.06),0 6px 18px rgba(15,31,61,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--navy);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .5em;color:var(--navy)}
h1{font-size:clamp(1.6rem,4.5vw,2.4rem)} h2{font-size:clamp(1.25rem,3vw,1.6rem)} h3{font-size:1.1rem}
p{margin:0 0 .9em} a{color:var(--orange-d)} img{max-width:100%}
.muted{color:var(--muted)} .small{font-size:.875rem} .center{text-align:center} .right{text-align:right}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:0;background:var(--navy);color:#fff;padding:.6rem 1rem;z-index:100}
.skip:focus{left:8px;top:8px}
.container{width:100%;max-width:1100px;margin:0 auto;padding:0 16px}
main.container{padding-top:20px;padding-bottom:96px;min-height:70vh}

/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line)}
.topbar .container{display:flex;align-items:center;gap:14px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--navy);text-decoration:none;white-space:nowrap}
.logo{width:34px;height:34px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:1rem;position:relative}
.logo::after{content:"";position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;background:var(--orange);border:2px solid #fff}
.nav{display:flex;gap:4px;margin-left:12px;flex:1}
.nav a{padding:8px 12px;border-radius:10px;color:var(--navy-2);text-decoration:none;font-weight:600;font-size:.95rem}
.nav a:hover{background:var(--soft)} .nav a[aria-current=page]{background:var(--orange-soft);color:var(--orange-d)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-weight:700;font-size:.85rem;text-decoration:none;border:1px solid var(--line);background:var(--soft);color:var(--navy)}
.pill.trial{background:var(--warn-soft);border-color:#f3dfa0;color:var(--warn)}
.pill.paid{background:var(--ok-soft);border-color:#b8e3cc;color:var(--ok)}
.pill.expired,.pill.ready{background:var(--orange-soft);border-color:#bcd2ff;color:var(--orange-d)}
.bottomnav{display:none}
@media (max-width:820px){
  .nav{display:none}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
  .bottomnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;min-height:56px;font-size:.72rem;font-weight:700;color:var(--muted);text-decoration:none}
  .bottomnav a span{font-size:1.25rem;line-height:1}
  .bottomnav a[aria-current=page]{color:var(--orange-d)}
  .brand small{display:none}
}

/* cards, grid */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none} .card.soft{background:var(--soft);box-shadow:none}
.card.accent{border-color:#bcd2ff;background:linear-gradient(135deg,#eaf1ff,#f6f9ff);box-shadow:none}
.grid{display:grid;gap:14px} .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.auto{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
@media (max-width:820px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}.g-keep2{grid-template-columns:repeat(2,1fr)!important}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between}
.stack>*+*{margin-top:14px} .mt{margin-top:16px} .mt2{margin-top:28px} .mb0{margin-bottom:0}
.stat{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff}
.stat b{display:block;font-size:1.6rem;line-height:1.1} .stat span{color:var(--muted);font-size:.85rem}

/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:12px;border:1px solid var(--navy);background:var(--navy);color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--navy-2)} .btn.orange{background:linear-gradient(135deg,#1d4ed8,#3b82f6);border-color:#1d4ed8} .btn.orange:hover{background:linear-gradient(135deg,#1e40af,#2563eb)}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--line)} .btn.ghost:hover{background:var(--soft)}
.btn.danger{background:var(--bad);border-color:var(--bad)} .btn.sm{min-height:36px;padding:6px 12px;font-size:.875rem;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed} .btn.block{width:100%}
label{display:block;font-weight:700;font-size:.9rem;margin:0 0 6px}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid #c9d2e0;border-radius:12px;background:#fff;color:var(--navy);font:inherit}
textarea{min-height:110px;resize:vertical} input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--orange)}
.field{margin-bottom:14px} .check{display:flex;gap:10px;align-items:flex-start;font-weight:500} .check input{margin-top:5px}
.hint{font-size:.82rem;color:var(--muted);margin-top:4px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.tab{white-space:nowrap;min-height:40px;padding:8px 14px;border:1px solid var(--line);background:#fff;border-radius:999px;font:inherit;font-weight:700;color:var(--navy-2);cursor:pointer}
.tab[aria-selected=true]{background:var(--navy);color:#fff;border-color:var(--navy)}

/* badges, alerts */
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.75rem;font-weight:800;letter-spacing:.01em;background:var(--soft);color:var(--navy-2);border:1px solid var(--line);vertical-align:middle}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:#b8e3cc} .badge.warn{background:var(--warn-soft);color:var(--warn);border-color:#f3dfa0}
.badge.bad{background:var(--bad-soft);color:var(--bad);border-color:#f5c2bd} .badge.info{background:var(--info-soft);color:var(--info);border-color:#c6d8f7}
.badge.orange{background:var(--orange-soft);color:var(--orange-d);border-color:#bcd2ff}
.alert{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--soft);font-size:.92rem}
.alert.warn{background:var(--warn-soft);border-color:#f3dfa0;color:#5f3d00} .alert.bad{background:var(--bad-soft);border-color:#f5c2bd;color:#7a1a12}
.alert.ok{background:var(--ok-soft);border-color:#b8e3cc;color:#0e5232} .alert.info{background:var(--info-soft);border-color:#c6d8f7;color:#173a78}
.progress{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,#1d4ed8,#38bdf8);border-radius:999px;transition:width .3s}
.progress.ok>i{background:var(--ok)} .progress.bad>i{background:var(--bad)}

/* hero (welcome) */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:start;padding:24px 0}
.hero h1 span{color:var(--orange)} .hero .lead{font-size:1.1rem;color:var(--muted);max-width:34em}
.feature{display:flex;gap:12px} .feature .ico{flex:none;width:44px;height:44px;border-radius:12px;background:var(--orange-soft);display:grid;place-items:center;font-size:1.3rem}
.feature h3{margin:0 0 2px;font-size:1rem} .feature p{margin:0;color:var(--muted);font-size:.9rem}
@media (max-width:820px){.hero{grid-template-columns:1fr}}

/* lists & tables */
.list{list-style:none;margin:0;padding:0} .list li{padding:12px 0;border-bottom:1px solid var(--line)} .list li:last-child{border:0}
.item{display:flex;align-items:center;gap:12px;justify-content:space-between}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.9rem} th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)} tr:last-child td{border:0}
.subject-card{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;cursor:pointer;text-align:left;font:inherit;width:100%}
.subject-card:hover,.subject-card[aria-pressed=true]{border-color:var(--orange);background:var(--orange-soft)}
.crumbs{font-size:.85rem;color:var(--muted);margin-bottom:8px}
.notes h3{margin-top:1.2em} .notes ul{padding-left:1.2em} .notes .box{background:var(--soft);border-left:4px solid var(--orange);padding:10px 14px;border-radius:8px;margin:12px 0}

/* modal & toast */
.overlay{position:fixed;inset:0;background:rgba(15,31,61,.55);display:grid;place-items:center;z-index:80;padding:16px}
.modal{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:820px}
#toasts{position:fixed;left:0;right:0;bottom:76px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;max-width:520px;font-size:.92rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad)} .toast.ok{background:var(--ok)}

/* tutor chat */
.chat{display:flex;flex-direction:column;gap:10px;min-height:320px;max-height:56vh;overflow-y:auto;padding:12px;background:var(--soft);border-radius:14px;border:1px solid var(--line)}
.bubble{max-width:88%;padding:10px 14px;border-radius:16px;font-size:.96rem;white-space:pre-wrap}
.bubble.me{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.bubble.bot{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.bubble .src{display:block;margin-top:8px;font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:38px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:700;font-size:.88rem;color:var(--navy-2);cursor:pointer}
.chip:hover{border-color:var(--orange);background:var(--orange-soft)}
.mic{width:48px;height:48px;border-radius:50%;border:0;background:var(--orange);color:#fff;font-size:1.3rem;cursor:pointer;flex:none}
.mic.on{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(180,35,24,.15)}}
.speechbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.speechbar select{width:auto;min-height:36px;padding:4px 8px}

/* quiz / exam */
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:#fff;font-weight:500}
.opt:hover{border-color:var(--orange)} .opt.sel{border-color:var(--orange);background:var(--orange-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt input{margin-top:5px}
.examtop{position:sticky;top:60px;z-index:30;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.2rem} .timer.low{color:var(--bad)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.qn{min-height:42px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:700;cursor:pointer}
.qn.done{background:var(--orange-soft);border-color:#bcd2ff} .qn.cur{background:var(--navy);color:#fff;border-color:var(--navy)} .qn.flag{outline:2px solid var(--warn)}
.exam-layout{display:grid;grid-template-columns:1fr 260px;gap:14px;align-items:start}
@media (max-width:820px){.exam-layout{grid-template-columns:1fr}.examtop{top:60px}}
.model{background:var(--info-soft);border:1px solid #c6d8f7;border-radius:12px;padding:12px;margin-top:8px}
.bar{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
@media (max-width:560px){.bar{grid-template-columns:100px 1fr 48px}}
.demo-box{border:2px dashed #b9a06a;background:#fffbe9;border-radius:14px;padding:14px}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.topbar,.bottomnav,.btn{display:none!important}}

/* ===== landing page (blue take on the reference design) ===== */
body.land{background:#e6eeff}
.land main{padding:14px 14px 40px}
.sheet{max-width:1180px;margin:0 auto;background:#f8faff;border-radius:30px;box-shadow:0 10px 40px rgba(29,78,216,.15);overflow:hidden;border:1px solid #d5e2ff}
.l-nav{display:flex;align-items:center;gap:16px;padding:16px 28px}
.l-nav .links{display:flex;gap:22px;margin-left:24px;flex:1}
.l-nav .links a{color:var(--navy-2);text-decoration:none;font-weight:600;font-size:.95rem}
.l-nav .links a:hover{color:var(--orange-d)}
.l-nav .btns{display:flex;gap:10px;margin-left:auto}
.btn.pillbtn{border-radius:999px}
.l-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;padding:34px 28px 44px;align-items:center}
.l-hero h1{font-size:clamp(2rem,5vw,3.3rem);letter-spacing:-.02em;margin-bottom:14px}
.l-hero h1 span{background:linear-gradient(90deg,#1d4ed8,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}
.l-hero .lead{color:var(--muted);font-size:1.08rem;max-width:32em}
.l-art{position:relative;min-height:340px;display:grid;place-items:center}
.l-art .blob{width:min(320px,80%);aspect-ratio:1;border-radius:46% 54% 48% 52%/52% 46% 54% 48%;background:linear-gradient(145deg,#1d4ed8,#60a5fa 70%,#a5d8ff);display:grid;place-items:center;font-size:7rem;box-shadow:0 20px 50px rgba(29,78,216,.35)}
.l-art .fl{position:absolute;background:#fff;border-radius:16px;padding:10px 14px;box-shadow:0 8px 24px rgba(29,78,216,.2);font-weight:700;font-size:.85rem;display:flex;gap:8px;align-items:center}
.fl.a{left:2%;top:14%}.fl.b{right:0;top:34%}.fl.c{left:8%;bottom:8%}
.band{background:linear-gradient(135deg,#1d4ed8,#2f6df0 60%,#4f8cf7);color:#fff;padding:18px 28px;display:flex;gap:10px 30px;flex-wrap:wrap;justify-content:center;align-items:center;font-weight:800;font-size:1.05rem}
.band span{opacity:.95}
.l-sec{padding:44px 28px}
.l-sec h2{font-size:clamp(1.5rem,3.5vw,2.1rem);text-align:center}
.l-sec .sub{text-align:center;color:var(--muted);max-width:40em;margin:0 auto 24px}
.searchbar{display:flex;gap:10px;max-width:560px;margin:0 auto 22px;background:#fff;border:1px solid #cfdcff;border-radius:999px;padding:6px 6px 6px 18px;box-shadow:var(--shadow)}
.searchbar input{border:0;min-height:40px;padding:0;background:transparent;box-shadow:none}
.searchbar input:focus{outline:none}
.benefit{display:grid;grid-template-columns:.9fr 1.1fr;gap:30px;align-items:center;background:#fff;border:1px solid #d5e2ff;border-radius:28px;padding:28px}
.artgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;border:2px dashed #93b4ff;border-radius:30px}
.artgrid div{aspect-ratio:1;border-radius:24px;display:grid;place-items:center;font-size:3rem;background:linear-gradient(145deg,#dbe7ff,#bcd2ff)}
.artgrid div:nth-child(2),.artgrid div:nth-child(3){background:linear-gradient(145deg,#1d4ed8,#60a5fa);color:#fff}
.benefit .feature+.feature{margin-top:14px}
.ccard{background:#fff;border:1px solid #d5e2ff;border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.ccard .thumb{height:110px;border-radius:16px;background:linear-gradient(135deg,#1d4ed8,#60a5fa);color:#fff;display:grid;place-items:center;font-size:2.2rem;font-weight:800;margin-bottom:12px}
.steps{counter-reset:s}
.step{background:#fff;border:1px solid #d5e2ff;border-radius:22px;padding:18px 18px 18px 64px;position:relative}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:16px;top:16px;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;display:grid;place-items:center;font-weight:800}
.step h3{margin:0 0 4px;font-size:1rem}.step p{margin:0;color:var(--muted);font-size:.9rem}
.cta{margin:0 28px 44px;border-radius:28px;background:linear-gradient(135deg,#1d4ed8,#2f6df0 60%,#4f8cf7);color:#fff;padding:32px;display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:center}
.cta h2,.cta h3{color:#fff;text-align:left}.cta p{opacity:.95}
.cta .btn.ghost{background:#fff;color:var(--orange-d);border-color:#fff}
.cta ul{margin:0;padding-left:1.1em}
.price{background:#fff;border:1px solid #bcd2ff;border-radius:26px;padding:26px;text-align:center;box-shadow:0 10px 30px rgba(29,78,216,.15)}
.price b.big{font-size:2.6rem;display:block;color:var(--orange-d);line-height:1.1}
.price ul{text-align:left;display:inline-block;margin:12px 0}
#join{scroll-margin-top:16px;background:#eaf1ff}
.l-foot{padding:22px 28px;text-align:center;color:var(--muted);font-size:.85rem;border-top:1px solid #d5e2ff}
@media (max-width:860px){.l-nav .links{display:none}.l-nav{padding:14px 16px}.l-hero,.benefit,.cta{grid-template-columns:1fr}.l-hero{padding:20px 16px 30px}.l-sec{padding:34px 16px}.cta{margin:0 14px 30px;padding:24px}.l-art{min-height:280px}.l-art .blob{font-size:5rem}}

/* ===== class colours: each class has its own colour (--cls is set from the student's class) ===== */
.has-cls .topbar{border-bottom:3px solid var(--cls)}
.has-cls .bottomnav{border-top:3px solid var(--cls)}
.clsbadge{display:inline-block;padding:3px 12px;border-radius:999px;background:var(--c,#2563eb);color:#fff;font-weight:800;font-size:.8rem;letter-spacing:.01em}
.clsdot{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:var(--c,#2563eb);vertical-align:-1px;margin-right:6px}
.clscard{border-top:5px solid var(--c,#2563eb)}
.tab.cls[aria-selected=true]{background:var(--c);border-color:var(--c);color:#fff}
.tab.cls{border-color:var(--c);color:var(--c)}
.tab.cls[aria-selected=true]{color:#fff}
.clsbanner{border-radius:20px;padding:16px 18px;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 70%,#000))}
.clsbanner h1,.clsbanner h2,.clsbanner p{color:#fff;margin:0}

/* ===== class discussion room (messenger style) ===== */
.wa-main{max-width:1280px!important;padding:8px 12px 0!important}
.wa{--c:#2563eb;display:grid;grid-template-columns:minmax(290px,370px) 1fr;height:calc(100dvh - 84px);min-height:460px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;position:relative}
.wa *{box-sizing:border-box}
.wa button{font:inherit}
.ic{border:0;background:none;cursor:pointer;width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;color:inherit;font-size:1.15rem;flex:none}
.ic:hover{background:rgba(0,0,0,.07)} .wa-head .ic:hover{background:rgba(255,255,255,.18)}

<script>
/* Uganda Smart Learning — shared engine.

(function (root) {

  const LS = (function () {

  const CLASS_COLORS = { S1: '#dc2626', S2: '#15803d', S3: '#c2410c', S4: '#7c3aed', S5: '#0e7490', S6: '#be185d' };
  const CATEGORIES = ['Official UNEB past paper', 'NCDC sample assessment', 'School mock', 'Teacher-created assessment', 'Licensed publisher material', 'AI-generated practice'];
  const PERMS = ['Own content (author holds the rights)', 'Licensed / written permission held', 'Authorised by UNEB / NCDC', 'Permission pending'];
  const ROLE_PERMS = { admin: ['*'], reviewer: ['review', 'submit', 'moderate'], teacher: ['submit', 'moderate', 'teach'], contributor: ['submit', 'moderate'], student: [] };

  const $ = (s, r) => (r || document).querySelector(s);

  async function hash(pw, salt) {

  }

    w.innerHTML = x ? '<div class="rpbar"><div class="quote" style="--q:' + hue(x.name) + '"><b>' + (editing ? 'Edit message' : 'Replying to ' + esc(x.userId === me.id ? 'yourself' : x.name)) + '</b><span>' + esc(snippet(x)) + '</span></div><button class="ic" id="rpx" aria-label="Cancel">✕</button></div>' : '';
    const b = document.getElementById('rpx'); if (b) b.onclick = () => { const wasEdit = !!editing; replyTo = null; editing = null; renderReplyBar(); if (wasEdit) { const tx = document.getElementById('tx'); if (tx) { tx.value = ''; tx.dispatchEvent(new Event('input')); } } };
  }
  function startReply(m) { editing = null; replyTo = m; renderReplyBar(); const tx = document.getElementById('tx'); if (tx) tx.focus(); }
  function startEdit(m) { replyTo = null; editing = m; renderReplyBar(); const tx = document.getElementById('tx'); if (tx) { tx.value = m.text; tx.dispatchEvent(new Event('input')); tx.focus(); } }
  function toggleEmoji() {
    const e = document.getElementById('emo'); if (!e) return; if (e.classList.toggle('on')) renderEmoji(); }
  function renderEmoji() {
    const e = document.getElementById('emo'); const list = [...EMO[emoCat]].filter(x => x.trim() && x !== '️');
    // split into whole emoji (handles variation selectors and ZWJ pairs well enough for this fixed set)
    const items = EMO[emoCat].match(/\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic}️?)*/gu) || list;
    e.innerHTML = '<div class="cats">' + Object.keys(EMO).map(k => '<button type="button" data-k="' + k + '" class="' + (k === emoCat ? 'on' : '') + '">' + k + '</button>').join('') + '</div><div class="grid8">' + items.map(x => '<button type="button" data-e="' + x + '">' + x + '</button>').join('') + '</div>';
    e.onclick = ev => { const k = ev.target.closest('[data-k]'), em = ev.target.closest('[data-e]'); if (k) { emoCat = k.dataset.k; renderEmoji(); } if (em) { const tx = document.getElementById('tx'), s = tx.selectionStart || tx.value.length; tx.value = tx.value.slice(0, s) + em.dataset.e + tx.value.slice(tx.selectionEnd || s); tx.focus(); tx.selectionStart = tx.selectionEnd = s + em.dataset.e.length; tx.dispatchEvent(new Event('input')); } };
  }
  function sendText() {
    const tx = document.getElementById('tx'), v = tx.value.trim(); if (!v) return; if ('Notification' in window && Notification.permission === 'default') { try { Notification.requestPermission(); } catch (e) { /* ignore */ } }
    if (editing) { const m = editing, r = Server.editMessage(m.id, v); if (!r.ok) return toast(r.error, 'bad'); sync.edit(m.id); editing = null; tx.value = ''; renderReplyBar(); tx.dispatchEvent(new Event('input')); refresh(true, true); return; }
    const r = Server.postMessage(cls, { text: v, reply: replyTo && replyTo.id }); if (!r.ok) return toast(r.error, 'bad');
    tx.value = ''; replyTo = null; typingUntil = 0; renderReplyBar(); tx.dispatchEvent(new Event('input')); (r.dropped || []).forEach(id => Media.del(id)); refresh(true); sync.push(r.id); sync.heartbeat();
  }
  async function sendPhoto(file) {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return toast('Choose a JPG, PNG or WebP picture.', 'bad');
    try {
      const bmp = await createImageBitmap(file), sc = Math.min(1, 1000 / Math.max(bmp.width, bmp.height)), cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc); cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
      const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.75)); if (!blob) throw new Error('encode'); const id = newMediaId(); await Media.put(id, blob);
      const r = Server.postMessage(cls, { media: { id, kind: 'image', mime: 'image/jpeg' }, text: '', reply: replyTo && replyTo.id }); if (!r.ok) { Media.del(id); return toast(r.error, 'bad'); }
      replyTo = null; renderReplyBar(); refresh(true); sync.push(r.id);
    } catch (e) { toast('Could not use that picture.', 'bad'); }
  }

  /* ---------- voice messages ---------- */
  async function startRec() {
    if (!navigator.mediaDevices || !window.MediaRecorder) return toast('Voice messages are not supported in this browser.', 'bad');
    let stream; try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { return toast('Microphone permission was denied. Allow it in the browser to record.', 'bad'); }
    const rec = new MediaRecorder(stream), chunks = [], samples = []; recState = { rec, stream, chunks, samples, t0: Date.now(), cancel: false };
    try { const ac = new (window.AudioContext || window.webkitAudioContext)(), an = ac.createAnalyser(); an.fftSize = 512; ac.createMediaStreamSource(stream).connect(an); const buf = new Uint8Array(an.fftSize); recState.ac = ac; recState.an = an; recState.buf = buf; } catch (e) { /* no meter */ }
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); }; rec.onstop = onRecStop; rec.start();
    const comp = document.getElementById('comp'); comp.innerHTML = '<div class="recrow"><span class="dot"></span><span id="rt">0:00</span><div class="lv" id="lv" aria-hidden="true"></div><button class="ic" id="rc" aria-label="Cancel recording" type="button">🗑️</button></div><button class="go" id="rs" aria-label="Send voice message" type="button">➤</button>';
    document.getElementById('rc').onclick = () => stopRec(true); document.getElementById('rs').onclick = () => stopRec(false);
    recState.timer = setInterval(() => {
      const s = Math.round((Date.now() - recState.t0) / 1000), el = document.getElementById('rt'); if (el) el.textContent = mmss(s);
      if (recState.an) { recState.an.getByteTimeDomainData(recState.buf); let pk = 0; recState.buf.forEach(v => { pk = Math.max(pk, Math.abs(v - 128)); }); recState.samples.push(pk); const lv = document.getElementById('lv'); if (lv) { lv.insertAdjacentHTML('beforeend', '<i style="height:' + Math.max(10, Math.min(100, pk * 2.2)) + '%"></i>'); while (lv.children.length > 60) lv.firstChild.remove(); } }
      if (s >= 120) stopRec(false);
    }, 100);
  }
  function stopRec(cancel) { if (!recState) return; recState.cancel = !!cancel; if (recState.rec.state !== 'inactive') recState.rec.stop(); }
  async function onRecStop() {
    const s = recState; recState = null; clearInterval(s.timer); s.stream.getTracks().forEach(t => t.stop()); if (s.ac) { try { s.ac.close(); } catch (e) { /* ignore */ } }
    const dur = Math.round((Date.now() - s.t0) / 1000); buildComposer(); if (s.cancel || dur < 1) return;
    const blob = new Blob(s.chunks, { type: s.rec.mimeType || 'audio/webm' }); if (blob.size > 3 * 1024 * 1024) return toast('That voice message is too large. Keep it under 2 minutes.', 'bad');
    const n = 40, sm = s.samples, peak = Math.max(1, ...sm), wave = sm.length ? Array.from({ length: n }, (_, i) => { const a = Math.floor(i * sm.length / n), b = Math.max(a + 1, Math.floor((i + 1) * sm.length / n)); return Math.max(14, Math.round(Math.max(...sm.slice(a, b)) / peak * 100)); }) : [];
    const id = newMediaId(); await Media.put(id, blob);
    const r = Server.postMessage(cls, { media: { id, dur: Math.max(1, dur), mime: blob.type || 'audio/webm', kind: 'voice', wave }, reply: replyTo && replyTo.id }); if (!r.ok) { Media.del(id); return toast(r.error, 'bad'); }
    replyTo = null; renderReplyBar(); refresh(true); sync.push(r.id);
  }

  /* ---------- class calls: one live call per class + subject, hosted by that subject's teacher ---------- */
  const enc = encodeURIComponent, LKEY = 'usl_calls_local', roomOf = (c, sub) => 'usl-call-' + c + '-' + sub;
  const Dir = {
    local() { try { return JSON.parse(USL.LS.getItem(LKEY) || '{}'); } catch (e) { return {}; } },
    saveLocal(m) { try { USL.LS.setItem(LKEY, JSON.stringify(m)); } catch (e) { /* ignore */ } },
    async list(c) { const now = Date.now(); if (Remote.on) { const r = await Remote.rest('GET', 'usl_calls?cls=eq.' + enc(c) + '&beat_at=gt.' + (now - 12000) + '&select=*'); if (r) return r; } return Object.values(this.local()).filter(x => x.cls === c && now - x.beat_at < 12000); },
    async beat(row) { row.beat_at = Date.now(); if (Remote.on) { const r = await Remote.rest('POST', 'usl_calls', row, { Prefer: 'resolution=merge-duplicates,return=minimal' }); if (r !== null) return; } const m = this.local(); m[row.room] = row; this.saveLocal(m); },
    async end(room) { if (Remote.on) await Remote.rest('DELETE', 'usl_calls?room=eq.' + enc(room)); const m = this.local(); delete m[room]; this.saveLocal(m); }
  };
  let live = [], cur = null, hostBeat = null;
  const canJoin = c => !isTeacher || pairs.some(p => p.cls === c.cls && p.subject === c.subject_id);
  async function pollCalls() { const c = cls; const l = await Dir.list(c); if (c !== cls) return; live = l; renderCall(); }
  const tiles = new Map(); let stageEl = null;
  function pillHtml() {
    if (!live.length) return '';
    return live.map(c => '<div class="callpill"><span>📞 <b>' + esc(c.subject_name) + '</b> class call' + (c.title ? ' · ' + esc(c.title) : '') + ' · ' + esc(c.host_name) + ' · ' + (c.count || 1) + ' in call</span>' + (canJoin(c) ? '<button data-j="' + esc(c.room) + '">Join</button>' : '<span class="small" style="margin-left:auto;opacity:.8">other teacher\'s subject</span>') + '</div>').join('');
  }
  function renderCall() {
    const pill = document.getElementById('callpill'); if (!pill) return;
    if (!call || !call.joined) {
      overlayOn = false; callov.classList.remove('on', 'has-stage'); if (callov.innerHTML) { callov.innerHTML = ''; callov.dataset.built = ''; } tiles.clear(); stageEl = null;
      pill.innerHTML = pillHtml(); pill.querySelectorAll('[data-j]').forEach(b => { b.onclick = () => { const c = live.find(x => x.room === b.dataset.j); if (c) joinLive(c); }; }); return;
    }
    pill.innerHTML = overlayOn ? '' : '<div class="callpill live">● In ' + esc(cur.subject_name) + ' call · ' + (call.peers().length + 1) + ' here<button id="cr">Return to call</button></div>'; const cr = document.getElementById('cr'); if (cr) cr.onclick = () => { overlayOn = true; renderCall(); };
    callov.classList.toggle('on', overlayOn); if (!overlayOn) return;
    const hasCam = call.local && call.local.getVideoTracks().length, st = call.stage();
    if (!callov.dataset.built) { callov.dataset.built = '1'; callov.innerHTML = '<div class="ct"><button class="ic" id="cmn" aria-label="Back to chat" style="color:#fff">←</button><div><b id="ctt"></b><span id="cts"></span></div></div><div class="stagebox" id="stagebox"><video autoplay playsinline id="stagev"></video><span class="nm" id="stagenm"></span></div><div class="callgrid" id="callgrid"></div><div class="ctrl" id="ctrl"></div>'; tiles.clear(); document.getElementById('cmn').onclick = () => { overlayOn = false; renderCall(); }; }
    document.getElementById('ctt').textContent = cur.subject_name + ' · ' + cls + (cur.title ? ' · ' + cur.title : ''); document.getElementById('cts').textContent = (call.peers().length + 1) + ' in call · host ' + cur.host_name;
    const sv = document.getElementById('stagev'); callov.classList.toggle('has-stage', !!(st && st.stream));
    if (st && st.stream) { if (sv.srcObject !== st.stream) sv.srcObject = st.stream; sv.muted = true; document.getElementById('stagenm').textContent = st.name + (st.self ? ' (you) · sharing' : ' · big screen'); } else if (sv.srcObject) sv.srcObject = null;
    const ctrl = document.getElementById('ctrl'), sig = [call.muted, call.cam, call.presenting, hasCam, call.canPresent].join();
    if (ctrl.dataset.sig !== sig) {
      ctrl.dataset.sig = sig;
      ctrl.innerHTML = '<button id="cm" class="' + (call.muted ? 'off' : '') + '" aria-label="' + (call.muted ? 'Unmute' : 'Mute') + '">' + (call.muted ? '🔇' : '🎤') + '</button>' + (hasCam ? '<button id="cc" class="' + (call.cam ? '' : 'off') + '" aria-label="Camera">' + (call.cam ? '📹' : '🚫') + '</button>' : '')
        + (call.canPresent ? (call.presenting ? '<button id="cp" class="on" aria-label="Stop big screen" title="Stop big screen">⏹️</button>' : (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia ? '<button id="cs" aria-label="Share screen on the big screen" title="Share your screen">🖥️</button>' : '') + '<button id="cv" aria-label="Show camera on the big screen" title="Show camera on the big screen">🎦</button>') : '')
        + '<button id="cl" class="end" aria-label="Leave call">📞</button>';
      document.getElementById('cm').onclick = () => call.mute(!call.muted); const cc = document.getElementById('cc'); if (cc) cc.onclick = () => call.camera(!call.cam); document.getElementById('cl').onclick = leaveLive;
      const pr = k => async () => { try { await call.startPresent(k); } catch (e) { toast(e && e.name === 'NotAllowedError' ? 'Sharing was cancelled or blocked.' : (e && e.message) || 'Could not start the big screen.', 'bad'); } };
      const cs = document.getElementById('cs'), cv = document.getElementById('cv'), cp = document.getElementById('cp'); if (cs) cs.onclick = pr('screen'); if (cv) cv.onclick = pr('camera'); if (cp) cp.onclick = () => call.stopPresent();
    }
    const grid = document.getElementById('callgrid'), want = [{ id: 'me', name: 'You', stream: call.local, self: true, state: 'you', role: me.role }].concat(call.peers());
    [...tiles.keys()].forEach(id => { if (!want.find(w => w.id === id)) { tiles.get(id).el.remove(); tiles.delete(id); } });
    want.forEach(w => {
      let t = tiles.get(w.id); if (!t) { const el = document.createElement('div'); el.className = 'tile'; el.innerHTML = '<video autoplay playsinline' + (w.self ? ' muted' : '') + '></video><div class="av" style="--c:' + hue(w.name) + '">' + esc(initials(w.name)) + '</div><span class="nm"></span><span class="st"></span>'; grid.appendChild(el); t = { el, video: el.querySelector('video') }; tiles.set(w.id, t); }
      if (t.video.srcObject !== w.stream && w.stream) t.video.srcObject = w.stream; const hasVideo = w.stream && w.stream.getVideoTracks().some(x => x.enabled && x.readyState === 'live');
      t.el.classList.toggle('audio', !hasVideo); t.el.dataset.state = w.state; t.el.dataset.name = w.name; t.el.querySelector('.nm').textContent = w.name + (w.role === 'teacher' ? ' · Teacher' : '') + (w.self && call.muted ? ' 🔇' : ''); t.el.querySelector('.st').textContent = w.self ? 'you' : (w.state === 'connected' ? 'connected' : 'connecting…');
    });
  }
  async function joinLive(info, video, announce) {
    if (!canJoin(info)) return toast('This call belongs to another teacher\'s subject.', 'bad');
    if (call && call.joined) { if (cur && cur.room === info.room) { overlayOn = true; return renderCall(); } return toast('Leave your current call first.', 'bad'); }
    const c = Call(info.room, me.name, me.role, renderCall); if (!c.supported) { c.close(); return toast('Calls are not supported in this browser. Try Chrome, Edge or Safari over https.', 'bad'); }
    try { await c.join(!!video); } catch (e) { c.close(); return toast(e && e.name === 'NotAllowedError' ? 'Microphone permission was denied. Allow it to join the call.' : 'Could not start the call: ' + (e && e.message || e), 'bad'); }
    call = c; cur = info; overlayOn = true; callov.dataset.built = '';
    if (info.host_id === me.id) { const row = Object.assign({}, info); const go = () => Dir.beat(Object.assign(row, { count: call ? call.peers().length + 1 : 1 })); go(); hostBeat = setInterval(go, 4000); }
    renderCall();
    if (announce) { const r = Server.postMessage(cls, { text: '📞 ' + me.name + ' started a ' + info.subject_name + ' class call' + (info.video ? ' (video)' : '') + (info.title ? ' — ' + info.title : '') }); if (r.ok) { refresh(true); sync.push(r.id); } }
  }
  async function leaveLive() {
    const c = call, i = cur; clearInterval(hostBeat); hostBeat = null; call = null; cur = null;
    if (c) c.close(); if (i && i.host_id === me.id) await Dir.end(i.room);
    live = live.filter(x => !i || x.room !== i.room || i.host_id !== me.id); renderCall(); pollCalls();
  }
  function startModal(video, subject) {
    const mine = pairs.filter(p => p.cls === cls); if (!mine.length) return toast('You are not assigned to teach in ' + cls + '.', 'bad');
    const md = modal('<h2>Start a class call</h2><p class="muted small">Only you and your learners in ' + esc(CNAME(cls)) + ' will see this call. Teachers of other subjects can run their own calls at the same time.</p>'
      + '<label>Subject<select id="cs-sub">' + mine.map(p => '<option value="' + esc(p.subject) + '"' + (p.subject === subject ? ' selected' : '') + '>' + esc(SUBJ(p.subject)) + '</option>').join('') + '</select></label>'
      + '<label>Topic / title (optional)<input id="cs-title" maxlength="60" placeholder="e.g. Revision: Transport in animals"></label>'
      + '<label>Type<select id="cs-kind"><option value="0"' + (video ? '' : ' selected') + '>Voice only</option><option value="1"' + (video ? ' selected' : '') + '>Video</option></select></label>'
      + '<div class="row" style="margin-top:12px"><button class="btn" id="cs-go">Start call</button><button class="btn ghost" id="cs-x">Cancel</button></div>');
    document.getElementById('cs-x').onclick = () => md.close();
    document.getElementById('cs-go').onclick = async () => {
      const sub = document.getElementById('cs-sub').value, vid = document.getElementById('cs-kind').value === '1', title = document.getElementById('cs-title').value.trim();
      md.close(); const ex = (await Dir.list(cls)).find(x => x.subject_id === sub);
      if (ex) { toast('A ' + SUBJ(sub) + ' call is already live — joining it.'); return joinLive(ex, vid, false); }
      joinLive({ room: roomOf(cls, sub), cls, subject_id: sub, subject_name: SUBJ(sub), host_id: me.id, host_name: me.name, title, video: vid, started_at: Date.now(), beat_at: Date.now(), count: 1 }, vid, true);
    };
  }

  /* ---------- open a room ---------- */
  function openRoom(cid) {
    if (call && cur && cur.cls !== cid) { toast('Leaving your call to switch class.'); leaveLive(); }
    if (!(call && call.joined)) { overlayOn = false; callov.classList.remove('on'); callov.dataset.built = ''; callov.innerHTML = ''; }
    cls = cid; live = []; msgs = []; pres = []; replyTo = null; editing = null; searchTerm = ''; matchIdx = -1; lastSig = ''; newBelow = 0; typingUntil = 0; legacy = legacy; recentSeen.clear(); stopPlayer();
    const r = Server.roomInfo(cls); if (!r.ok) { chat.innerHTML = '<div class="card" style="margin:20px"><h2>Room unavailable</h2><p>' + esc(r.error) + '</p><a class="btn" href="dashboard.html">Back</a></div>'; wa.classList.add('show-chat'); return; }
    myRead = getNum('read'); unreadFrom = myRead; lastPing = Date.now(); buildChat(); wa.classList.add('show-chat');
    refresh(true); applyMuteBox(); renderSide(); pollCalls(); sync.pull().then(() => { sync.heartbeat(); refresh(true); });
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenu(); const i = document.getElementById('info'); if (i) i.classList.remove('on'); const em = document.getElementById('emo'); if (em) em.classList.remove('on'); } });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { markRead(); updTitle(); } });
  window.addEventListener('storage', () => refresh(false));
  window.addEventListener('beforeunload', () => { if (hostBeat && cur) { try { const m = Dir.local(); delete m[cur.room]; Dir.saveLocal(m); if (Remote.on) Remote.rest('DELETE', 'usl_calls?room=eq.' + enc(cur.room)); } catch (e) { /* ignore */ } } if (call) call.close(); });
  openRoom(cls); renderSide();
  setInterval(() => { refresh(false); applyMuteBox(); }, 1500);
  setInterval(() => sync.pull(), 2000); setInterval(pollCalls, 3000);
  if (isTeacher && qs.get('call')) setTimeout(() => startModal(false, qs.get('call')), 400);
  hbTimer = setInterval(() => sync.heartbeat(), 4000);
})();

</script>
